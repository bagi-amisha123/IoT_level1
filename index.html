<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toggle Color Page</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      background-color: #4a90e2;
      color: white;
      border: none;
    }

    button:hover {
      background-color: #357ab7;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Web Page</h1>
  <button onclick="toggleColor()">Toggle Background</button>

  <script>
    let isWhite = true;
    function toggleColor() {
      document.body.style.backgroundColor = isWhite ? "#f0f0f0" : "#4a90e2";
      isWhite = !isWhite;
    }
  </script>
</body>
</html>
